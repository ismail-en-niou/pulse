name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Pulse.slnx --configuration Release

      # Tests that touch the real keychain, Credential Manager or login items skip themselves when CI is set.
      - name: Test
        run: dotnet test Pulse.slnx --configuration Release --no-build
